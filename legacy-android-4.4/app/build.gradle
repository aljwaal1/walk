plugins { id 'com.android.application' }

android {
    namespace 'com.explapp.walklegacy'
    compileSdk 33
    defaultConfig {
        applicationId 'com.explapp.walklegacy'
        minSdk 19
        targetSdk 28
        versionCode 3
        versionName '3.0.0-legacy'
    }
    buildTypes { release { minifyEnabled false } }
    lintOptions { abortOnError true; disable 'ExpiredTargetSdkVersion' }
}
