name: Build Walk Android 4.4

on:
  push:
    branches: [android-4.4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'
      - name: Build legacy APK
        run: gradle -p legacy-android-4.4 assembleRelease
      - name: Save APK
        run: |
          mkdir -p apk
          cp legacy-android-4.4/app/build/outputs/apk/release/app-release.apk apk/walk-android-4.4.apk
      - name: Commit APK
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/walk-android-4.4.apk
          git commit -m "Build Android 4.4 walk APK" || exit 0
          git push
