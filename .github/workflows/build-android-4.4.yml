name: Build Walk Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths: ['legacy-android-4.4/**', '.github/workflows/build-android-4.4.yml']

permissions:
  contents: write

concurrency:
  group: walk-android-4-4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4
          fetch-depth: 0

      - name: Apply robust Android 4.4 GPS compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('legacy-android-4.4/app/src/main/java/com/explapp/walklegacy/WalkTrackingService.java')
          text = service.read_text(encoding='utf-8')

          old = '''        boolean providerRequested = false;
        try {
            if (locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 1f, this);
                providerRequested = true;
            }
        } catch (Exception ignored) { }

        try {
            if (locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) {
                locationManager.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 3000L, 3f, this);
                providerRequested = true;
            }
        } catch (Exception ignored) { }
'''
          new = '''        boolean providerRequested = false;
        try {
            java.util.List<String> providers = locationManager.getProviders(true);
            for (String provider : providers) {
                if (provider == null || LocationManager.PASSIVE_PROVIDER.equals(provider)) continue;
                long minTime = LocationManager.GPS_PROVIDER.equals(provider) ? 700L : 1800L;
                locationManager.requestLocationUpdates(provider, minTime, 0f, this);
                providerRequested = true;
            }
        } catch (Exception ignored) { }

        if (!providerRequested) {
            try {
                locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 700L, 0f, this);
                providerRequested = true;
            } catch (Exception ignored) { }
        }
'''
          if old in text:
              text = text.replace(old, new)

          old_accuracy = '''        float accuracy = location.hasAccuracy() ? location.getAccuracy() : 999f;
        accuracyMeters = accuracy;
        if (accuracy > 60f) { broadcastState(); return; }
'''
          new_accuracy = '''        float accuracy;
        if (location.hasAccuracy()) accuracy = location.getAccuracy();
        else if (LocationManager.GPS_PROVIDER.equals(location.getProvider())) accuracy = 45f;
        else if (LocationManager.NETWORK_PROVIDER.equals(location.getProvider())) accuracy = 90f;
        else accuracy = 70f;
        accuracyMeters = accuracy;
        if (accuracy > 90f) { persist(false); broadcastState(); return; }
'''
          if old_accuracy in text:
              text = text.replace(old_accuracy, new_accuracy)
          service.write_text(text, encoding='utf-8')

          activity = Path('legacy-android-4.4/app/src/main/java/com/explapp/walklegacy/MainActivity.java')
          ui = activity.read_text(encoding='utf-8')
          old_ui = 'if (tracking) statusView.setText(accuracyMeters > 35f ? "إشارة ضعيفة • انتظر قليلاً" : "التتبع نشط في الخلفية");'
          new_ui = 'if (tracking) statusView.setText(accuracyMeters < 0f ? "جاري البحث عن إشارة GPS" : accuracyMeters > 60f ? "تم التقاط الموقع • الدقة تتحسن" : "إشارة GPS متصلة • التتبع نشط");'
          if old_ui in ui:
              ui = ui.replace(old_ui, new_ui)
          activity.write_text(ui, encoding='utf-8')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Lint native Android app
        run: |
          set -o pipefail
          gradle -p legacy-android-4.4 lintDebug --stacktrace --no-daemon 2>&1 | tee walk-lint.log
      - name: Build signed debug APK
        run: |
          set -o pipefail
          gradle -p legacy-android-4.4 clean assembleDebug --stacktrace --info --no-daemon 2>&1 | tee walk-build.log
      - name: Save and verify APK
        run: |
          set -euo pipefail
          APK="$(find legacy-android-4.4/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p apk
          cp "$APK" apk/walk-android-4.4.apk
          sha256sum apk/walk-android-4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: walk-android-4.4
          path: apk/walk-android-4.4.apk
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walk-android-4.4-build-log
          path: walk-build.log
          if-no-files-found: ignore
      - name: Persist failure log for diagnosis
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p apk
          {
            test -f walk-lint.log && cat walk-lint.log || true
            test -f walk-build.log && cat walk-build.log || true
          } > apk/walk-build-failure.log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/walk-build-failure.log
          git diff --cached --quiet || (git commit -m 'Record Walk Android 4.4 build failure' && git push origin HEAD:android-4.4)

      - name: Commit GPS fix and APK
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add legacy-android-4.4/app/src/main/java/com/explapp/walklegacy/WalkTrackingService.java \
                  legacy-android-4.4/app/src/main/java/com/explapp/walklegacy/MainActivity.java \
                  apk/walk-android-4.4.apk
          if ! git diff --cached --quiet; then
            git commit -m 'fix(legacy): robust GPS acquisition and rebuild APK'
            git pull --rebase origin android-4.4
            git push origin HEAD:android-4.4
          fi
