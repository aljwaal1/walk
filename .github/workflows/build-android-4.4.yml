name: Build Walk Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths:
      - 'legacy-android-4.4/**'
      - '.github/workflows/build-android-4.4.yml'

permissions:
  contents: write

concurrency:
  group: walk-android-4-4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 33
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Build legacy APK
        run: |
          set -o pipefail
          gradle -p legacy-android-4.4 clean assembleRelease --stacktrace --warning-mode all --no-daemon 2>&1 | tee walk-build.log

      - name: Save and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find legacy-android-4.4/app/build/outputs/apk -type f -name '*release*.apk' | head -n 1)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo 'Release APK was not produced.'
            find legacy-android-4.4/app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi
          unzip -t "$APK" >/dev/null
          mkdir -p apk
          cp "$APK" apk/walk-android-4.4.apk
          sha256sum apk/walk-android-4.4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: walk-android-4.4
          path: apk/walk-android-4.4.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walk-android-4.4-build-log
          path: walk-build.log
          if-no-files-found: ignore

      - name: Commit APK
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/walk-android-4.4.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Walk Android 4.4 APK'
            git push origin HEAD:android-4.4
          fi
