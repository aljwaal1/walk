name: Build Android 4.4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android 4.4 branch
        uses: actions/checkout@v4
        with:
          ref: android-4.4
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        run: |
          flutter create --platforms=android --org com.explapp --no-pub .
          rm -rf test
          flutter pub get

      - name: Configure Android app
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.explapp.walk.legacy"/' android/app/build.gradle.kts || true
          sed -i 's/applicationId ".*"/applicationId "com.explapp.walk.legacy"/' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 19/' android/app/build.gradle.kts || true
          sed -i 's/minSdk = [0-9][0-9]*/minSdk = 19/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 19/' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9][0-9]*/minSdkVersion 19/' android/app/build.gradle || true
          sed -i 's/android:label="[^"]*"/android:label="رفيق المشي 4.4"/' android/app/src/main/AndroidManifest.xml || true

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Save independent APK
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/walk-android-4.4.apk
          cat > DOWNLOAD_APK.md <<'EOF'
          # Walk — Android 4.4

          APK مستقل لفرع Android 4.4:

          https://github.com/aljwaal1/walk/raw/android-4.4/apk/walk-android-4.4.apk
          EOF

      - name: Commit APK to Android 4.4 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin android-4.4
          git add apk/walk-android-4.4.apk DOWNLOAD_APK.md
          git commit -m "ci: update Android 4.4 APK" || echo "No changes"
          git push origin HEAD:android-4.4
