name: Build Legacy Android 4.4 APK

on:
  push:
    branches: [legacy-android-4.4]
    paths:
      - 'legacy-native/**'
      - '.github/workflows/build-legacy-android-4.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legacy-android-4.4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build release APK
        working-directory: legacy-native
        run: gradle :app:assembleRelease --stacktrace

      - name: Publish APK to branch
        run: |
          mkdir -p apk
          cp legacy-native/app/build/outputs/apk/release/app-release.apk apk/walking-companion-android-4.4.apk
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apk/walking-companion-android-4.4.apk
          git diff --cached --quiet || git commit -m "Build legacy Android 4.4 APK"
          git push origin HEAD:legacy-android-4.4
